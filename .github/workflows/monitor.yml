name: Daily data and Pages

on:
  schedule:
    # 北京时间 19:05、20:10、21:10。GitHub 调度可能延迟，程序重新检查当地交易日期。
    - cron: '5 11 * * 1-5'
    - cron: '10 12 * * 1-5'
    - cron: '10 13 * * 1-5'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: '首次建库：盘中或休市时获取最近收盘数据'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'artifacts/**']

permissions:
  contents: read

concurrency:
  group: monitor-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify data logic before collection
        run: python -m unittest discover -s tests -v
      - name: Collect public data
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        shell: bash
        run: |
          if [ "$BOOTSTRAP" = "true" ]; then
            python -m monitor update --bootstrap
          else
            python -m monitor update
          fi
      - name: Commit validated observations and status
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        shell: bash
        run: |
          if [ -d data/observations ]; then git add -- data/observations; fi
          if [ -f data/status.json ]; then git add -- data/status.json; fi
          if [ -f data/quarantine.json ]; then git add -- data/quarantine.json; fi
          git add -- data/calendar.json
          if [ -f data/calendar_refresh.json ]; then git add -- data/calendar_refresh.json; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: update validated observations and health'
            # 不强推；有外部同时提交时保留失败日志，后续定时重试。
            git push origin HEAD:main
          fi
      - name: Build published snapshot (including degraded status)
        run: python -m monitor build
      - name: Frontend data contract and JavaScript
        run: |
          node --check site/app.mjs
          node --test tests/frontend.test.mjs
      - name: Preserve build for local download
        uses: actions/upload-artifact@v4
        with:
          name: monitor-site
          path: site/
          retention-days: 7
      - name: Configure Pages
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
  deploy:
    if: vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy same-run artifact
        id: deployment
        uses: actions/deploy-pages@v4
  health:
    if: always() && needs.build.outputs.collection_outcome == 'failure'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report degraded collection after publishing status
        run: |
          echo '::error::Collection failed, is stale, or requires review. Valid history is preserved. Inspect data/status.json.'
          exit 1
